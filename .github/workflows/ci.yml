name: ci
on: [push, pull_request]
# Serialize experimental snapshots without discarding a running verification.
# GitHub may replace the one pending snapshot; release/main/PR runs retain
# distinct groups and must finish their own qualification.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/codex/sia-assurance-kernel-20261019' && github.ref || github.run_id }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: dependencies
        # Immutable wheel hashes copied from the official PyPI JSON records on
        # 2026-08-30:
        # https://pypi.org/pypi/cryptography/50.0.1/json
        # https://pypi.org/pypi/cffi/2.0.0/json
        # https://pypi.org/pypi/pycparser/3.0/json
        run: |
          printf '%s\n' \
            'cryptography==50.0.1 --hash=sha256:ff838d62ec1bfce4f9ba7fa16f4a7b554cd8d0c299e6be37502161a660c84eef --hash=sha256:51593d180cf6d179bde5c5d065bed81386b1f381656ae7d042b7ffc87a9895ad --hash=sha256:51afcfceb15597cf2635068e4ac9a56b2abde622edde17f37d85fd7b5306497a --hash=sha256:e22dfed744bd4002e909464cb23d2f0b05c6f3113a79ef2e9864a53db737c733 --hash=sha256:407fe2b6db00939c05c0e945e9914238f2f0a430974839429dafc82b1ee6bee5 --hash=sha256:9dde0a357190eb3b1da1bb9ab750e9c85cba82ca5977aa0836cbb94e92611239' \
            'cffi==2.0.0 --hash=sha256:3e17ed538242334bf70832644a32a7aae3d83b57567f9fd60a26257e992b79ba' \
            'pycparser==3.0 --hash=sha256:b727414169a36b7d524c1c3e31839a521725078d7b2ff038656844266160a992' \
            'ruff==0.17.1 --hash=sha256:872e03dd231744d6c5ec5c8af6be52b71323fc6ee096e4c8b34d9f844ee3b978 --hash=sha256:a6ef98e51de8ef38082f90653ceeb84944bd7673783eea13e1647c5b9b064189' \
            > "$RUNNER_TEMP/sia-ci-requirements.txt"
          python -m pip install --only-binary=:all: --require-hashes \
            -r "$RUNNER_TEMP/sia-ci-requirements.txt"
      # Partial correctness lane; comprehensive Power of Ten analysis remains OPEN.
      - name: experimental assurance checker static analysis
        env:
          RAYON_NUM_THREADS: "1"
          PYTHONWARNINGS: error
        run: |
          set -euo pipefail
          test "$(ruff --version)" = 'ruff 0.17.1'
          # Reject all suppression directives, including the newer Ruff forms.
          # This conservative byte scan also refuses directive-like text in strings.
          python3 -B - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import re
          with Path('docs/evidence/assurance-ruff-rules-v1.txt').open('rb') as rules:
              raw_rules = rules.read(65537)
          if len(raw_rules) > 65536 or hashlib.sha256(raw_rules).hexdigest() != '0fea46b8e04811e2b1142cc0517f8152d1c7f36641ca13e14d8b94ea9b3c0741':
              raise SystemExit('Frozen analyzer rule identity mismatch')
          names = ('scripts/assurance_acceptance_manifest.py', 'tests/test_assurance_acceptance_manifest.py',
                   'spark/check-proof-summary.py', 'spark/tests/test_proof_summary.py',
                   'spark/tests/test_proof_summary_overloads.py',
                   'spark/check-allocation-controls.py', 'spark/tests/test_allocation_controls.py',
                   'spark/transport/continuity_process.py', 'spark/tests/test_continuity_command.py',
                   'spark/tests/test_startup_guard.py',
                   'bin/siaeventpackcapture.py', 'bin/siaeventpackproposal.py',
                   'tests/test_event_pack_proposal.py', 'tests/test_event_pack_admission.py',
                   'tests/test_backup_upload_diagnostics.py',
                   'tests/test_fenced_metadata_admission.py',
                   'tests/test_release_metadata_admission.py', 'bin/siarelease.py',
                   'tests/test_corpus_root_admission.py')
          # Analyze the complete corpus-root reader, including its error paths.
          with Path('install.sh').open('rb') as installer:
              raw_installer = installer.read(1048577)
          marker = b"corpus_receipt_recorded_root() {\n  python3 - \"${1:-$CORPUS_RECEIPT}\" \"$SHARE/corpus\" <<'PY'\n"
          if len(raw_installer) > 1048576 or raw_installer.count(marker) != 1:
              raise SystemExit('Corpus-root reader extraction mismatch')
          body, ending, _tail = raw_installer.split(marker, 1)[1].partition(b'\nPY\n}')
          if not ending or not body or len(body) > 4096:
              raise SystemExit('Corpus-root reader body mismatch')
          embedded_path = Path(os.environ['RUNNER_TEMP']) / 'sia-corpus-root-reader.py'
          with embedded_path.open('xb') as embedded:
              if embedded.write(body + b'\n') != len(body) + 1:
                  raise SystemExit('Incomplete corpus-root reader extraction')
          names += (str(embedded_path),)
          forbidden = re.compile(rb'#\s*(?:noqa\b|(?:ruff|flake8)\s*:\s*(?:noqa\b|ignore\b|file-ignore\b|disable\b|enable\b))', re.I)
          for name in names:
              with Path(name).open('rb') as source:
                  raw = source.read(1048577)
              if len(raw) > 1048576 or forbidden.search(raw):
                  raise SystemExit('Oversized source or suppression directive: ' + name)
          PY
          task_ruff_rules="$(paste -sd, docs/evidence/assurance-ruff-rules-v1.txt)"
          task_ruff_json="$RUNNER_TEMP/sia-assurance-checker-ruff.json"
          task_ruff_stderr="$RUNNER_TEMP/sia-assurance-checker-ruff.stderr"
          task_ruff_exit=0
          timeout --kill-after=5s 30s ruff check \
            --isolated --no-cache --target-version py312 \
            --select "$task_ruff_rules" \
            --ignore-noqa --no-fix --no-fix-only --no-unsafe-fixes --no-preview \
            --no-respect-gitignore --no-force-exclude --output-format json \
            scripts/assurance_acceptance_manifest.py \
            tests/test_assurance_acceptance_manifest.py \
            spark/check-proof-summary.py \
            spark/tests/test_proof_summary.py \
            spark/tests/test_proof_summary_overloads.py \
            spark/check-allocation-controls.py \
            spark/tests/test_allocation_controls.py \
            spark/transport/continuity_process.py \
            spark/tests/test_continuity_command.py \
            spark/tests/test_startup_guard.py \
            bin/siaeventpackcapture.py \
            bin/siaeventpackproposal.py \
            tests/test_event_pack_proposal.py \
            tests/test_event_pack_admission.py \
            tests/test_backup_upload_diagnostics.py \
            tests/test_fenced_metadata_admission.py \
            tests/test_release_metadata_admission.py \
            bin/siarelease.py \
            tests/test_corpus_root_admission.py \
            "$RUNNER_TEMP/sia-corpus-root-reader.py" \
            > "$task_ruff_json" 2> "$task_ruff_stderr" || task_ruff_exit=$?
          # Bounded previews only; the exit/stderr/complete-JSON gates below
          # still reject a failure even when its diagnostic output is larger.
          head -c 65536 "$task_ruff_json"
          head -c 65536 "$task_ruff_stderr" >&2
          test "$task_ruff_exit" -eq 0
          test ! -s "$task_ruff_stderr"
          python3 -B - "$task_ruff_json" <<'PYJSON'
          from pathlib import Path
          import json
          import sys
          with Path(sys.argv[1]).open('rb') as source:
              raw = source.read(1048577)
          if len(raw) > 1048576:
              raise SystemExit('Analyzer output exceeds byte limit')
          value = json.loads(raw.decode('utf-8'))
          if type(value) is not list or value:
              raise SystemExit('Analyzer diagnostics are not empty')
          PYJSON
      - name: experimental assurance boundary controls
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          timeout --kill-after=5s 60s python3 -m unittest discover -s spark/tests -p test_proof_summary.py -v
          timeout --kill-after=5s 60s python3 -m unittest discover -s spark/tests -p test_proof_summary_overloads.py -v
          timeout --kill-after=5s 60s python3 -m unittest discover -s spark/tests -p test_allocation_controls.py -v
          timeout --kill-after=5s 60s python3 -m unittest discover -s spark/tests -p test_continuity_command.py -v
          timeout --kill-after=5s 60s python3 -m unittest discover -s spark/tests -p test_startup_guard.py -v
          timeout --kill-after=5s 60s python3 -m unittest discover -s spark/tests -p test_request_packet.py -v
          timeout --kill-after=5s 60s python3 -m unittest discover -s spark/tests -p test_grant_record.py -v
          timeout --kill-after=5s 60s python3 -m unittest discover -s spark/tests -p test_scoped_grant_record.py -v
          timeout --kill-after=5s 60s python3 -m unittest discover -s spark/isolation -p test_committed_export.py -v
          timeout --kill-after=5s 60s python3 -m unittest discover -s spark/resources -p test_cgroup_results.py -v
          timeout --kill-after=5s 30s python3 -B spark/tests/test_continuity_process.py ContinuityEnvelope -v
          timeout --kill-after=5s 30s env PYTHONWARNINGS=error python3 -B -m unittest tests.test_assurance_acceptance_manifest -v
      # Compile-only controls in the existing job; no new concurrency or proof claim.
      - name: pinned GNAT allocation compiler controls
        run: |
          set -euo pipefail
          task_gnat_root="$RUNNER_TEMP/sia-allocation-gnat"
          mkdir "$task_gnat_root"
          curl --fail --location --silent --show-error --connect-timeout 10 --max-time 60 \
            --max-filesize 402244219 \
            https://github.com/alire-project/GNAT-FSF-builds/releases/download/gnat-16.1.0-1/gnat-x86_64-linux-16.1.0-1.tar.gz \
            --output "$task_gnat_root/toolchain.tar.gz"
          printf '%s  %s\n' \
            9f74f58a827a2ad40dd84c72a413e75ea52888e0d8f7e252fba4d26762402703 \
            "$task_gnat_root/toolchain.tar.gz" | sha256sum -c -
          timeout --kill-after=5s 60s tar --extract --gzip --no-same-owner --no-same-permissions \
            --file "$task_gnat_root/toolchain.tar.gz" --directory "$task_gnat_root"
          task_gnat_compiler="$task_gnat_root/gnat-x86_64-linux-16.1.0-1/bin/gcc"
          test "$("$task_gnat_compiler" -dumpfullversion)" = '16.1.0'
          sha256sum "$task_gnat_compiler" spark/restrictions.adc
          task_control_exit=0
          prlimit --as=2147483648 --fsize=536870912 --core=0 \
            timeout --kill-after=5s 60s python3 -B -W error \
            spark/check-allocation-controls.py --compiler "$task_gnat_compiler" \
            --output "$RUNNER_TEMP/sia-allocation-results" || task_control_exit=$?
          # Results and expected negative diagnostics remain in the hosted log.
          find "$RUNNER_TEMP/sia-allocation-results" -maxdepth 2 -type f \
            \( -name results.json -o -name stdout -o -name stderr \) \
            -exec head -c 16384 {} \;
          test "$task_control_exit" -eq 0
      - name: compile all python
        run: python3 -m py_compile bin/*.py bin/sia bin/sia-brainstem bin/sia-ledger bin/sia-mcp bin/sia-intent-review
      - name: shell syntax
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n uninstall.sh
          bash -n bin/sia-setup
          bash -n spark/check-event-pack-model.sh
      - name: release artifact contracts
        run: |
          python3 -m json.tool manifest.json >/dev/null
          python3 -m json.tool config.example.json >/dev/null
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            version="$(python3 -c 'import json,pathlib; print(json.loads(pathlib.Path("manifest.json").read_text(encoding="utf-8"))["version"])')"
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          test -s schema-pack/pack.yaml
          test -s preview.png
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD --
      - name: shell semantics
        run: |
          docker run --rm --network none --cap-drop all \
            --security-opt no-new-privileges --read-only \
            -v "$PWD:/mnt:ro" \
            koalaman/shellcheck-alpine@sha256:5921d946dac740cbeec2fb1c898747b6105e585130cc7f0602eec9a10f7ddb63 \
            shellcheck /mnt/install.sh /mnt/uninstall.sh /mnt/bin/sia-setup \
            /mnt/spark/check-event-pack-model.sh
      - name: real btrfs remount readmission
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends btrfs-progs
          python3 tests/btrfs_remount_smoke.py --run
      - name: unit and contract tests
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: python3 -m unittest discover -s tests -v

  # Both shipped defects (issues #2 and #3) lived at the SIA<->gbrain subprocess seam, and
  # the unit suite stubs that seam — so this job builds the exact pinned gbrain and runs the
  # real-binary contract lane. In the main test job that lane skips (honestly) for lack of a
  # binary; here it must run and pass.
  gbrain-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: pinned bun (mirrors install.sh)
        run: |
          set -euo pipefail
          BUN_VERSION=1.4.0
          BUN_ASSET=bun-linux-x64.zip
          BUN_SHA256=2d03fb5fb83ac8b567aca0a281b2ce1a1a19d488f56c2968d88c3f25e92fe452
          curl -fsSLo "$RUNNER_TEMP/bun.zip" \
            "https://github.com/oven-sh/bun/releases/download/bun-v$BUN_VERSION/$BUN_ASSET"
          printf '%s  %s\n' "$BUN_SHA256" "$RUNNER_TEMP/bun.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP/bun"
          BUN_BIN="$RUNNER_TEMP/bun/${BUN_ASSET%.zip}/bun"
          chmod 0755 "$BUN_BIN"
          test "$("$BUN_BIN" --version)" = "$BUN_VERSION"
          echo "BUN_BIN=$BUN_BIN" >> "$GITHUB_ENV"
      - name: build the exact pinned SIA gbrain overlay (mirrors install.sh)
        run: |
          set -euo pipefail
          # CI binds the same six-field pin and overlay as the installer.
          # This checkout check is not the installer's hostile-filesystem policy.
          PIN_PATH="$PWD/GBRAIN_PIN"
          OVERLAY="$PWD/GBRAIN_OVERLAY.patch"
          PIN_VALUES="$(python3 -B - "$PIN_PATH" "$OVERLAY" <<'PYPIN'
          import datetime
          import hashlib
          import os
          import re
          import stat
          import sys

          def generation(info):
              return (info.st_dev, info.st_ino, info.st_mode, info.st_nlink, info.st_uid,
                      info.st_size, info.st_mtime_ns, info.st_ctime_ns)

          def read_regular(path, maximum):
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC | os.O_NONBLOCK)
              try:
                  before = os.fstat(fd)
                  if (not stat.S_ISREG(before.st_mode) or before.st_nlink != 1
                          or before.st_uid != os.geteuid()
                          or not 0 <= before.st_size <= maximum):
                      raise ValueError('Unsafe CI pin input')
                  chunks, remaining = [], before.st_size
                  while remaining:
                      chunk = os.read(fd, min(1048576, remaining))
                      if not chunk:
                          raise ValueError('Short CI pin input')
                      chunks.append(chunk)
                      remaining -= len(chunk)
                  if os.read(fd, 1) or generation(os.fstat(fd)) != generation(before):
                      raise ValueError('CI pin input changed')
                  return b''.join(chunks)
              finally:
                  os.close(fd)

          pin = read_regular(sys.argv[1], 65536)
          overlay = read_regular(sys.argv[2], 16777216)
          fields = {}
          for line in pin.decode('utf-8', errors='strict').splitlines():
              if not line or line.startswith('#'):
                  continue
              if line.count('=') != 1:
                  raise ValueError('Malformed CI pin assignment')
              key, value = line.split('=', 1)
              if key in fields:
                  raise ValueError('Duplicate CI pin field')
              fields[key] = value
          patterns = {
              'commit': r'[0-9a-f]{40}', 'version': r'[0-9]+(?:[.][0-9]+)+',
              'bun_lock_sha256': r'[0-9a-f]{64}', 'overlay_sha256': r'[0-9a-f]{64}',
              'overlay_tree_oid': r'[0-9a-f]{40}',
              'verified': r'[0-9]{4}-[0-9]{2}-[0-9]{2}',
          }
          if (fields.keys() != patterns.keys()
                  or any(re.fullmatch(pattern, fields[key]) is None
                         for key, pattern in patterns.items())):
              raise ValueError('Missing, unknown or invalid CI pin field')
          if (datetime.date.fromisoformat(fields['verified']).isoformat() != fields['verified']
                  or hashlib.sha256(overlay).hexdigest() != fields['overlay_sha256']):
              raise ValueError('CI pin date or overlay digest mismatch')
          selected = ('commit', 'version', 'bun_lock_sha256',
                      'overlay_sha256', 'overlay_tree_oid')
          print('\t'.join(fields[key] for key in selected)
                + '\t' + hashlib.sha256(pin).hexdigest())
          PYPIN
          )"
          IFS=$'\t' read -r PIN PIN_VERSION PIN_LOCK_SHA256 PIN_OVERLAY_SHA256 PIN_OVERLAY_TREE_OID PIN_SHA256 <<< "$PIN_VALUES"
          task_build_home="$RUNNER_TEMP/gbrain-build-home"
          mkdir -p "$task_build_home/.config" "$task_build_home/.cache" "$task_build_home/.local/state"
          task_build_env=(
            /usr/bin/env -i HOME="$task_build_home" GBRAIN_HOME="$task_build_home"
            XDG_CONFIG_HOME="$task_build_home/.config" XDG_CACHE_HOME="$task_build_home/.cache"
            XDG_STATE_HOME="$task_build_home/.local/state" TMPDIR="$RUNNER_TEMP"
            BUN_INSTALL_CACHE_DIR="$RUNNER_TEMP/bun-cache" PATH=/usr/bin:/bin
            LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC DO_NOT_TRACK=1 NO_COLOR=1
            GBRAIN_SKIP_STARTUP_HOOKS=1 GBRAIN_SYNC_NO_DELEGATE=1
            GBRAIN_NO_BANNER=1 GBRAIN_SELF_UPGRADE_MODE=off
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          )
          SRC="$RUNNER_TEMP/gbrain-src"
          "${task_build_env[@]}" git init -q "$SRC"
          "${task_build_env[@]}" git -C "$SRC" remote add origin https://github.com/garrytan/gbrain
          "${task_build_env[@]}" git -C "$SRC" fetch -q --depth 1 --no-tags origin "$PIN"
          "${task_build_env[@]}" git -C "$SRC" checkout -q --detach FETCH_HEAD
          task_head="$("${task_build_env[@]}" git -C "$SRC" rev-parse HEAD)"
          test "$task_head" = "$PIN"
          "${task_build_env[@]}" git -C "$SRC" diff --quiet --no-ext-diff
          "${task_build_env[@]}" git -C "$SRC" diff --cached --quiet --no-ext-diff
          task_untracked="$("${task_build_env[@]}" git -C "$SRC" ls-files --others --exclude-standard)"
          test -z "$task_untracked"
          printf '%s  %s\n' "$PIN_LOCK_SHA256" "$SRC/bun.lock" | sha256sum -c -
          task_package_sha256="$(sha256sum "$SRC/package.json" | cut -d' ' -f1)"
          "${task_build_env[@]}" "$BUN_BIN" install --no-env-file --cwd "$SRC" \
            --frozen-lockfile --production --ignore-scripts --no-progress
          printf '%s  %s\n' "$PIN_LOCK_SHA256" "$SRC/bun.lock" | sha256sum -c -
          printf '%s  %s\n' "$task_package_sha256" "$SRC/package.json" | sha256sum -c -
          "${task_build_env[@]}" git -C "$SRC" diff --quiet --no-ext-diff
          "${task_build_env[@]}" git -C "$SRC" diff --cached --quiet --no-ext-diff
          printf '%s  %s\n' "$PIN_OVERLAY_SHA256" "$OVERLAY" | sha256sum -c -
          "${task_build_env[@]}" git -C "$SRC" apply --check --index --whitespace=error-all "$OVERLAY"
          "${task_build_env[@]}" git -C "$SRC" apply --index --whitespace=error-all "$OVERLAY"
          task_source_identity() {
            task_head="$("${task_build_env[@]}" git -C "$SRC" rev-parse HEAD)"
            test "$task_head" = "$PIN"
            task_tree="$("${task_build_env[@]}" git -C "$SRC" write-tree)"
            test "$task_tree" = "$PIN_OVERLAY_TREE_OID"
            "${task_build_env[@]}" git -C "$SRC" diff --quiet --no-ext-diff
            task_untracked="$("${task_build_env[@]}" git -C "$SRC" ls-files --others --exclude-standard)"
            test -z "$task_untracked"
            printf '%s  %s\n' "$PIN_LOCK_SHA256" "$SRC/bun.lock" | sha256sum -c -
            printf '%s  %s\n' "$task_package_sha256" "$SRC/package.json" | sha256sum -c -
            printf '%s  %s\n' "$PIN_SHA256" "$PIN_PATH" | sha256sum -c -
            printf '%s  %s\n' "$PIN_OVERLAY_SHA256" "$OVERLAY" | sha256sum -c -
          }
          task_source_identity
          "${task_build_env[@]}" "$BUN_BIN" build --no-env-file --no-install \
            --no-compile-autoload-dotenv --no-compile-autoload-bunfig --compile \
            --outfile "$RUNNER_TEMP/gbrain-bin" "$SRC/src/cli.ts"
          task_source_identity
          chmod 0755 "$RUNNER_TEMP/gbrain-bin"
          task_version="$("${task_build_env[@]}" "$RUNNER_TEMP/gbrain-bin" --version)"
          test "$task_version" = "gbrain $PIN_VERSION"
          printf 'gbrain_base=%s\ngbrain_lock=%s\ngbrain_overlay=%s\ngbrain_tree=%s\n' \
            "$PIN" "$PIN_LOCK_SHA256" "$PIN_OVERLAY_SHA256" "$PIN_OVERLAY_TREE_OID"
          sha256sum "$BUN_BIN" "$RUNNER_TEMP/gbrain-bin" "$PIN_PATH" "$OVERLAY"
          task_binary_sha256="$(sha256sum "$RUNNER_TEMP/gbrain-bin" | cut -d' ' -f1)"
          echo "SIA_GBRAIN_BIN=$RUNNER_TEMP/gbrain-bin" >> "$GITHUB_ENV"
          echo "SIA_GBRAIN_SHA256=$task_binary_sha256" >> "$GITHUB_ENV"
      - name: real-gbrain contract lane
        env:
          PYTHONWARNINGS: error::ResourceWarning
          # The skip gate below reads unittest's plain-text lines; keep them plain.
          NO_COLOR: "1"
          PYTHON_COLORS: "0"
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$SIA_GBRAIN_SHA256" "$SIA_GBRAIN_BIN" | sha256sum -c -
          output="$(python3 -m unittest tests.test_gbrain_contract tests.test_gbrain_overlay_contract -v 2>&1)" || {
            printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          printf '%s  %s\n' "$SIA_GBRAIN_SHA256" "$SIA_GBRAIN_BIN" | sha256sum -c -
          # A skip here would mean SIA_GBRAIN_BIN was ignored — the lane must actually run.
          # The one declared exception is GbrainCompiledRenderContract, which needs
          # operator-supplied pinned expectation artifacts (SIA_GBRAIN_COMPILED_*)
          # this runner does not hold; its skip message says so and is not proof.
          # Only per-test skip lines are judged; unittest's own summary line
          # ("OK (skipped=1)") names the count, not a reason, and the count must
          # equal the declared skips so a second, undeclared skip cannot hide.
          declared="$(printf '%s\n' "$output" \
            | grep -c ' \.\.\. skipped .*compiled render transport NOT EXERCISED' || true)"
          undeclared="$(printf '%s\n' "$output" | grep ' \.\.\. skipped' \
            | grep -vc 'compiled render transport NOT EXERCISED' || true)"
          summary="$(printf '%s\n' "$output" | sed -n 's/^OK (skipped=\([0-9]*\))$/\1/p')"
          if [ "$undeclared" != 0 ] || [ "${summary:-0}" != "$declared" ]; then
            echo "contract lane skipped despite a provided binary (declared=$declared undeclared=$undeclared summary=${summary:-0})" >&2
            exit 1
          fi

  # ROADMAP's "`main` is frozen while marketplace verification is pending" was
  # enforced socially, and verify issue #4078 was retargeted three times because
  # a push moved HEAD off the bound commit — the maintainer's constraint is not
  # "bind a good commit" but "bind the commit that is currently HEAD". The rule
  # is mechanical here: ROADMAP.md carries one machine-readable freeze
  # declaration naming the frozen branch and the exact bound SHA, and a push to
  # that branch which is not that commit is a red build. A declaration this job
  # cannot read is a failure, never a silent pass, and a state it does not apply
  # to is announced rather than quietly skipped.
  marketplace-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # github.event.before can be older than HEAD^ when one push carries
          # several commits. Keep that exact provenance available, along with
          # HEAD^ for classifying a bookkeeping-only rebind.
          fetch-depth: 0
      - name: marketplace freeze gate
        env:
          SIA_FREEZE_EVENT: ${{ github.event_name }}
          SIA_FREEZE_REF_TYPE: ${{ github.ref_type }}
          SIA_FREEZE_REF_NAME: ${{ github.ref_name }}
          SIA_FREEZE_HEAD: ${{ github.sha }}
          SIA_FREEZE_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          count="$(grep -cE '^[[:space:]]*sia-freeze:' ROADMAP.md || true)"
          [ -n "$count" ] || count=0
          if [ "$count" != 1 ]; then
            echo "refusing: ROADMAP.md must carry exactly one sia-freeze" \
              "declaration; found $count" >&2
            exit 1
          fi
          line="$(grep -E '^[[:space:]]*sia-freeze:' ROADMAP.md)"
          state="$(printf '%s\n' "$line" | sed -n 's#.*state=\([a-z]*\).*#\1#p')"
          branch="$(printf '%s\n' "$line" \
            | sed -n 's#.*branch=\([A-Za-z0-9._/-]*\).*#\1#p')"
          sha="$(printf '%s\n' "$line" | sed -n 's#.*sha=\([0-9a-f]*\).*#\1#p')"
          case "$state" in
            none|pending) ;;
            *)
              echo "refusing: unreadable sia-freeze state in ROADMAP.md" >&2
              exit 1 ;;
          esac
          if [ -z "$branch" ] \
             || ! printf '%s' "$sha" | grep -qE '^[0-9a-f]{40}$'; then
            echo "refusing: a pending sia-freeze declaration must name" \
              "branch= and a full 40-hex sha=" >&2
            exit 1
          fi
          if [ "${SIA_FREEZE_EVENT:-}" != push ] \
             || [ "${SIA_FREEZE_REF_TYPE:-}" != branch ]; then
            echo "::notice::the freeze gate guards pushes to '$branch' only;" \
              "this is ${SIA_FREEZE_EVENT:-?} on" \
              "${SIA_FREEZE_REF_TYPE:-?} ${SIA_FREEZE_REF_NAME:-?}," \
              "so nothing about the binding was checked"
            exit 0
          fi
          before="${SIA_FREEZE_BEFORE:-}"
          if [ "$before" = 0000000000000000000000000000000000000000 ] \
             && [ "${SIA_FREEZE_REF_NAME:-}" != "$branch" ]; then
            echo "::notice::new unrelated branch has no prior frozen HEAD;" \
              "nothing about the binding was checked"
            exit 0
          fi
          if ! printf '%s' "$before" | grep -qE '^[0-9a-f]{40}$' \
             || [ "$before" = 0000000000000000000000000000000000000000 ] \
             || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "refusing: push provenance is missing, zero, or unavailable;" \
              "the frozen branch cannot be checked safely" >&2
            exit 1
          fi
          transition=rebinding
          if [ "${SIA_FREEZE_REF_NAME:-}" != "$branch" ]; then
            # A declaration in this push cannot erase the branch that the
            # previous commit froze. Classify against that prior authority
            # before granting the ordinary unrelated-branch exemption.
            prior_count="$(git show "$before:ROADMAP.md" 2>/dev/null \
              | grep -cE '^[[:space:]]*sia-freeze:' || true)"
            [ -n "$prior_count" ] || prior_count=0
            if [ "$prior_count" = 0 ]; then
              echo "::notice::no prior freeze applies to this unrelated branch;" \
                "nothing about the binding was checked"
              exit 0
            fi
            if [ "$prior_count" != 1 ]; then
              echo "refusing: prior ROADMAP freeze state is ambiguous;" \
                "branch retargeting cannot be authorized" >&2
              exit 1
            fi
            prior_line="$(git show "$before:ROADMAP.md" \
              | grep -E '^[[:space:]]*sia-freeze:')"
            if ! printf '%s\n' "$prior_line" | grep -qE \
                '^[[:space:]]*sia-freeze: state=(pending|none) branch=[A-Za-z0-9._/-]+ sha=[0-9a-f]{40}[[:space:]]*$'; then
              echo "refusing: prior ROADMAP freeze state is unreadable;" \
                "branch retargeting cannot be authorized" >&2
              exit 1
            fi
            prior_state="$(printf '%s\n' "$prior_line" \
              | sed -n 's#.*state=\([a-z]*\).*#\1#p')"
            prior_branch="$(printf '%s\n' "$prior_line" \
              | sed -n 's#.*branch=\([A-Za-z0-9._/-]*\).*#\1#p')"
            if [ "$prior_state" != pending ] \
               || [ "${SIA_FREEZE_REF_NAME:-}" != "$prior_branch" ]; then
              echo "::notice::neither declaration freezes this branch;" \
                "nothing about the binding was checked"
              exit 0
            fi
            branch="$prior_branch"
            sha="$(printf '%s\n' "$prior_line" \
              | sed -n 's#.*sha=\([0-9a-f]*\).*#\1#p')"
            state=pending
            transition=retargeting
          fi
          if [ "${SIA_FREEZE_HEAD:-}" = "$sha" ]; then
            echo "::notice::HEAD is the bound commit $sha"
            exit 0
          fi
          if [ "$state" = none ]; then
            prior_count="$(git show "$before:ROADMAP.md" 2>/dev/null \
              | grep -cE '^[[:space:]]*sia-freeze:' || true)"
            [ -n "$prior_count" ] || prior_count=0
            if [ "$prior_count" = 0 ] \
               && git cat-file -e "$before:ROADMAP.md" 2>/dev/null; then
              # The commit before this push carries no declaration at all:
              # the declaration was introduced by this push (1.8.0 landed on
              # a main frozen at 8a624ef, which predates it). There is no
              # prior freeze to close, exactly as on an unrelated branch.
              echo "::notice::the prior commit has no freeze declaration;" \
                "no marketplace verification is pending"
              exit 0
            fi
            if [ "$prior_count" != 1 ]; then
              echo "refusing: prior ROADMAP freeze state is unavailable or" \
                "ambiguous; cycle closure cannot be authorized" >&2
              exit 1
            fi
            prior_state="$(git show "$before:ROADMAP.md" \
              | grep -E '^[[:space:]]*sia-freeze:' \
              | sed -n 's#.*state=\([a-z]*\).*#\1#p')"
            if [ "$prior_state" = none ]; then
              echo "::notice::no marketplace verification is pending;" \
                "the freeze gate does not apply"
              exit 0
            fi
            if [ "$prior_state" != pending ]; then
              echo "refusing: prior ROADMAP freeze state is unreadable;" \
                "cycle closure cannot be authorized" >&2
              exit 1
            fi
            transition="cycle-closing"
          fi
          # The one act that must stay possible on a frozen branch: no commit
          # can name its own SHA, so rebinding is always a second commit. The
          # exemption is the declaration replacement itself, not arbitrary
          # prose smuggled through under the same filename.
          parent="$(git rev-parse "${SIA_FREEZE_HEAD}^" 2>/dev/null || true)"
          if [ -n "$parent" ] && [ "$before" = "$parent" ] \
             && changed="$(git diff --name-only \
                "${SIA_FREEZE_HEAD}^" "$SIA_FREEZE_HEAD" 2>/dev/null)" \
             && [ "$changed" = ROADMAP.md ]; then
            changed_lines="$(git diff --unified=0 --no-color \
              "${SIA_FREEZE_HEAD}^" "$SIA_FREEZE_HEAD" -- ROADMAP.md \
              | sed -n '/^[+-][^+-]/p')"
            removed="$(printf '%s\n' "$changed_lines" \
              | grep -cE '^-[[:space:]]*sia-freeze:' || true)"
            added="$(printf '%s\n' "$changed_lines" \
              | grep -cE '^\+[[:space:]]*sia-freeze:' || true)"
            unrelated="$(printf '%s\n' "$changed_lines" \
              | grep -vE '^[+-][[:space:]]*sia-freeze:' || true)"
            if [ "$removed" = 1 ] && [ "$added" = 1 ] \
               && [ -z "$unrelated" ]; then
              echo "::notice::$transition commit: only the sia-freeze declaration changed"
              exit 0
            fi
          fi
          echo "refusing: marketplace verification is pending on $sha, but" \
            "$branch HEAD is ${SIA_FREEZE_HEAD:-?}. The verify flow binds one" \
            "exact SHA and refuses when it is no longer default-branch HEAD," \
            "so this push invalidates the evidence chain the listing is" \
            "waiting on. Queue the work on a branch, or close the cycle by" \
            "setting state=none in the ROADMAP.md sia-freeze declaration." >&2
          exit 1
